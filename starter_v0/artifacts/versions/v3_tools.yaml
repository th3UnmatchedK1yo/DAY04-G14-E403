# v3 — stricter argument contract derived from the omissions observed in v2.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi người dùng khi thiếu thông tin bắt buộc hoặc khi cần xác nhận. Luôn truyền rõ response_type."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi cụ thể cần người dùng trả lời"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Dùng text khi cần bổ sung dữ liệu; yes_no khi cần xác nhận; choice khi có danh sách lựa chọn"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn khi response_type=choice"}
      required: [question, response_type]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tìm thông tin trên web. Luôn truyền rõ topic và timeframe thay vì dựa vào giá trị mặc định."
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: "Chủ đề cốt lõi cần tìm; không đưa loại nguồn hoặc khoảng thời gian vào query."
        topic:
          type: string
          enum: [general, news]
          default: "general"
          description: "Dùng news cho yêu cầu về tin/tin tức/sự kiện; dùng general cho tra cứu web không phải tin."
        timeframe:
          type: string
          enum: [day, week, month, year]
          default: "week"
          description: "hôm nay hoặc mới nhất -> day; tuần này -> week; tháng này -> month; năm nay -> year; nếu không nêu thời gian dùng week."
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query, topic, timeframe]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Team-authored tools ----------------
  - name: deduplicate
    description: "Loại item nghiên cứu trùng lặp khỏi danh sách đã có, giữ item xuất hiện đầu tiên. Chỉ dùng sau khi đã thu thập items; không dùng để tìm kiếm, đọc URL, tóm tắt hoặc gửi nội dung."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item nghiên cứu cần khử trùng lặp"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
        strategy:
          type: string
          enum: [url, title, url_or_title]
          default: "url_or_title"
          description: "So trùng theo URL, title, hoặc chỉ cần trùng một trong hai"
      required: [items]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]
